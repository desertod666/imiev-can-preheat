[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = time

[env:esp32dev]
board = esp32dev
build_flags =
    -DPREHEAT_CAN_TX=5
    -DPREHEAT_CAN_RX=4

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DPREHEAT_CAN_TX=17
    -DPREHEAT_CAN_RX=18
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
